# Development stack. For a public deployment use docker-compose.prod.yml.
x-app-env: &app-env
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  QDRANT_URL: http://qdrant:6333
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  EMBEDDING_LOCAL_FILES_ONLY: ${EMBEDDING_LOCAL_FILES_ONLY:-true}
  HF_HOME: /app/.cache/huggingface

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - app_cache:/app/.cache
    depends_on:
      - qdrant
    restart: unless-stopped

  # One-shot ingestion. Run explicitly:
  #   docker compose run --rm ingest
  # Set EMBEDDING_LOCAL_FILES_ONLY=false for the first run so the model can be
  # downloaded into the shared cache volume.
  ingest:
    build: .
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes:
      - app_cache:/app/.cache
      - ./data:/app/data:ro
    depends_on:
      - qdrant
    command: ["python", "-m", "scripts.ingest", "--path", "data/gutenqa_chunks.parquet"]

volumes:
  qdrant_data:
  app_cache:
