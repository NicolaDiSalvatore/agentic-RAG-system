[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-system"
version = "0.1.0"
description = "Agentic RAG system built on LlamaIndex, LangChain, and LangGraph with a hybrid retriever, reranker, and grade-and-retry orchestration over the GutenQA dataset."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # API
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    # Configuration / validation
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    # TLS
    "truststore==0.10.4",
    # Agent orchestration
    "langgraph==1.2.11",
    # Langchain
    "langchain==1.3.16",
    "langchain-groq==1.1.3",
    # LlamaIndex
    "llama-index-core==0.14.23",
    "llama-index-embeddings-huggingface==0.7.0",
    "llama-index-retrievers-bm25==0.7.1",
    "llama-index-vector-stores-qdrant==0.10.3",
    # LLM providers
    "groq==0.37.1",
    "openai==2.54.0",
    # Retrieval
    "rank-bm25==0.2.2",
    # Embeddings
    "sentence-transformers==5.7.0",
    "torch==2.13.0",
    "transformers==4.57.6",
    "safetensors==0.8.0",
    # Vector database
    "qdrant-client==1.19.0",
    # Dataset loading
    "datasets==5.0.1",
    # Character-set detection (requests requires chardet < 6)
    "chardet>=3,<6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]